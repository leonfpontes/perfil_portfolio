<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título, descrição, canônica, Open Graph e JSON-LD: um por página, injetados no build (src/seo/head.ts). -->
    <!--app-head-->
    <meta name="author" content="Leonardo Fonseca Pontes" />
    <meta name="theme-color" content="#f6f3ec" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fontes do primeiro quadro: pré-carregadas para não "pular" o layout -->
    <link rel="preload" href="/fonts/roboto.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Modo de movimento aplicados antes do primeiro paint (sem "flash") -->
    <script>
      try {
        var h = document.documentElement;
        var m = localStorage.getItem('lp:motion') || 'system';
        var os = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (os) h.classList.add('os-reduced-motion');
        if (m === 'reduced' || (m === 'system' && os)) h.classList.add('reduced-motion');
      } catch (e) {}
    </script>

    <!--
      Google Analytics 4 — adiado. A fila (dataLayer/gtag) existe desde já, então
      nenhum evento se perde; o script (≈176 KiB) só baixa com a página ociosa,
      sem competir com o primeiro carregamento no celular.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-843HEPMCYR');
      addEventListener('load', function () {
        var load = function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-843HEPMCYR';
          document.head.appendChild(s);
        };
        'requestIdleCallback' in window ? requestIdleCallback(load, { timeout: 4000 }) : setTimeout(load, 2500);
      });
    </script>
  </head>
  <body>
    <noscript>Contato: leonfpontes@gmail.com · WhatsApp +55 16 99109-1234</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
