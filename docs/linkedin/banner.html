<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Banner LinkedIn</title>
<!--
  Capa do LinkedIn (1584×396) na identidade do site: Papel & Marinho sobre os tokens LP Noir
  (docs/DESIGN.md). Como gerar as imagens: docs/linkedin/README.md.

  O texto mora só nos espaços que a foto de perfil deixa livres (medido no LinkedIn real):
  - foto no desktop: círculo x 50–368, y 205 para baixo (capa a 74% do tamanho);
  - foto no celular: círculo x 66–492, y 198 para baixo (capa a 45% do tamanho);
  - botão de editar (só para o dono): canto superior direito, x > 1370, y < 215 no celular.
  Por isso: o título ocupa a faixa de cima (y < 195), e o endereço fica embaixo, à direita
  da foto. Nenhum texto abaixo de 26 px, que no celular ainda vira ~12 px.
  Os gates (src/components/art/funil.ts) viram anéis que irradiam da foto; o sinal chega ao endereço.
-->
<style>
  @font-face {
    font-family: "Roboto";
    font-weight: 100 900;
    src: url("roboto.woff2") format("woff2");
  }
  @font-face {
    font-family: "Instrument Serif";
    font-style: italic;
    font-weight: 400;
    src: url("instrument-serif-italic.woff2") format("woff2");
  }
  :root {
    --paper: #f6f3ec;
    --paper-raised: #fbf9f4;
    --navy: #14213d;
    --bronze: #7a5c2e;
    --muted: color-mix(in oklab, var(--navy) 72%, var(--paper));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: var(--paper); }
  body {
    font-family: "Roboto", system-ui, sans-serif; color: var(--navy);
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  .banner { position: relative; width: 1584px; height: 396px; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  .layer svg { display: block; width: 100%; height: 100%; }
  .spot {
    position: absolute; left: 200px; top: -260px; width: 1200px; height: 560px;
    background: radial-gradient(closest-side, var(--paper-raised), transparent 75%);
  }

  /* Faixa de cima: livre em qualquer tela. */
  h1 {
    position: absolute; left: 64px; top: 30px;
    font-size: 62px; line-height: 1; font-weight: 500; letter-spacing: -0.028em; white-space: nowrap;
  }
  h1 .l2 { display: block; margin-top: 8px; }
  h1 em {
    font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 1.2em; letter-spacing: -0.01em; color: var(--bronze);
  }

  /* Embaixo, à direita da foto: onde o funil chega. */
  .cta { position: absolute; left: 1100px; top: 262px; display: flex; flex-direction: column; gap: 12px; }
  .url { font-size: 48px; font-weight: 500; letter-spacing: -0.025em; line-height: 1; }
  .what { font-size: 26px; line-height: 1.15; color: var(--muted); }
</style>
</head>
<body>
<div class="banner">
  <div class="spot"></div>
  <div class="layer"><svg id="funil" viewBox="0 0 1584 396"></svg></div>
  <h1>Mentoria de produto e diagnóstico de PMO<span class="l2">que <em>saem do papel.</em></span></h1>
  <div class="cta">
    <span class="url">leopontes.com.br</span>
    <span class="what">Mentoria 1:1 · Diagnóstico de PMO</span>
  </div>
</div>
<script>
  // A foto de perfil é o centro: os gates da metodologia (funil.ts) viram anéis que irradiam dela.
  // Muitas iniciativas no G1, cada vez menos para fora; a linha de sinal sai da foto, cruza os
  // quatro gates e chega ao endereço. Centro entre o círculo do desktop (209,364) e o do celular
  // (279,411); o primeiro anel (r 270) fica fora dos dois.
  const CX = 240, CY = 392;
  const GATES = [
    { id: 'G1', label: 'Intake', r: 290, n: 11 },
    { id: 'G2', label: 'Business case', r: 450, n: 6 },
    { id: 'G3', label: 'Delivery', r: 645, n: 3 },
    { id: 'G4', label: 'Benefits', r: 795, n: 1 },
  ];
  const END = { x: 1074, y: 291 };
  const ANG = Math.atan2(CY - END.y, END.x - CX); // direção do sinal
  const pt = (r, a) => [CX + r * Math.cos(a), CY - r * Math.sin(a)];
  let svg = '';
  for (const g of GATES) {
    svg += `<circle cx="${CX}" cy="${CY}" r="${g.r}" fill="none" stroke="#14213d" stroke-opacity="0.2" stroke-width="1.4"/>`;
    // Iniciativas no anel, só no setor livre (abaixo do título: y > 214), afastadas do sinal.
    const maxA = Math.asin(Math.min(1, (CY - 222) / g.r));
    const minA = Math.asin((CY - 352) / g.r);
    for (let i = 0; i < g.n; i++) {
      const a = g.n === 1 ? ANG : minA + ((maxA - minA) * (i + 0.5)) / g.n;
      if (g.n > 1 && Math.abs(a - ANG) < 0.035) continue;
      const [x, y] = pt(g.r, a);
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#14213d" fill-opacity="0.38"/>`;
    }
    // Rótulo do gate onde o anel encontra a base da capa.
    const lx = CX + Math.sqrt(g.r * g.r - 16 * 16);
    svg += `<text x="${(lx + 9).toFixed(0)}" y="384" font-family="Roboto" font-weight="500" font-size="17" letter-spacing="1.4" fill="#14213d" fill-opacity="0.6"><tspan fill="#7a5c2e" fill-opacity="1">${g.id}</tspan> ${g.label.toUpperCase()}</text>`;
  }
  // Sinal: da borda da foto até o endereço, um marco bronze em cada gate.
  const [sx, sy] = pt(214, ANG);
  svg += `<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${END.x}" y2="${END.y}" stroke="#7a5c2e" stroke-width="2.4" stroke-linecap="round"/>`;
  for (const g of GATES) {
    const [x, y] = pt(g.r, ANG);
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="#f6f3ec" stroke="#7a5c2e" stroke-width="2.4"/>`;
  }
  svg += `<circle cx="${END.x}" cy="${END.y}" r="7" fill="#7a5c2e"/>`;
  document.getElementById('funil').innerHTML = svg;
</script>
</body>
</html>
