name: Instagram

# Publicador próprio do Instagram (scripts/instagram/publicar.mjs), no lugar do Postiz.
# A cada 10 minutos publica o que chegou na hora em instagram/agenda.json e grava o resultado
# de volta na main (commit "[instagram]", que a Vercel ignora). Toda segunda renova os tokens.
# Segredos: IG_TOKEN_PONTES_BRAIN, IG_TOKEN_GIRAHUB, RESEND_API_KEY, ALERTA_EMAIL e, para
# gravar token renovado, GH_SECRETS_TOKEN (token fino com permissão "Secrets: write").
# O GitHub pode atrasar o agendamento alguns minutos em horário de pico.

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      post:
        description: "Id de um post para publicar agora (vazio = rodada normal)"
        required: false
      simular:
        description: "Só mostrar o que faria, sem publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event.schedule != '0 12 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/instagram
            instagram/agenda.json
          sparse-checkout-cone-mode: false

      - name: Publicar o que chegou na hora
        env:
          IG_TOKEN_PONTES_BRAIN: ${{ secrets.IG_TOKEN_PONTES_BRAIN }}
          IG_TOKEN_GIRAHUB: ${{ secrets.IG_TOKEN_GIRAHUB }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_EMAIL: ${{ secrets.ALERTA_EMAIL }}
          SOMENTE: ${{ inputs.post }}
          SIMULAR: ${{ inputs.simular && '1' || '' }}
        run: node scripts/instagram/publicar.mjs

      - name: Gravar o resultado na agenda
        if: always()
        run: |
          git diff --quiet -- instagram/agenda.json && exit 0
          git config user.name "agenda-instagram"
          git config user.email "agenda-instagram@users.noreply.github.com"
          git add instagram/agenda.json
          git commit -m "[instagram] atualiza status da agenda"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

  renovar-token:
    if: github.event.schedule == '0 12 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/instagram
            instagram/agenda.json
          sparse-checkout-cone-mode: false
      - name: Renovar tokens
        env:
          IG_TOKEN_PONTES_BRAIN: ${{ secrets.IG_TOKEN_PONTES_BRAIN }}
          IG_TOKEN_GIRAHUB: ${{ secrets.IG_TOKEN_GIRAHUB }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_EMAIL: ${{ secrets.ALERTA_EMAIL }}
        run: node scripts/instagram/renovar-token.mjs
